name: Test Redis version selection
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-redis
        name: Setup Redis version 6
        uses: .
        with:
          redis-version: "6"

      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6379" ]; then
            echo "FAIL: expected redis-port to be 6379, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: redis-port is 6379"

      - name: Assert redis-path output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected redis-path to be non-empty"
            exit 1
          fi
          echo "PASS: redis-path is set to $ACTUAL"

      - name: Assert Redis version 6 is installed
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "Checking Redis version..."
          VERSION=$("$REDIS_PATH/redis-server" --version 2>&1)
          echo "Redis version output: $VERSION"
          if ! echo "$VERSION" | grep -q "v=6\."; then
            echo "FAIL: expected Redis version 6.x, got: $VERSION"
            exit 1
          fi
          echo "PASS: Redis version 6 is installed"

      - name: Assert Redis 6 is running and responding
        run: |
          echo "Checking Redis is running on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: redis-cli ping did not return PONG"
            exit 1
          fi
          echo "PASS: Redis 6 is running and responding"
