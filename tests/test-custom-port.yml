name: Test redis setup with custom port
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6380"
          auto-start: "true"
      - name: Assert redis-port output matches custom port
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6380" ]; then
            echo "FAIL: expected redis-port=6380, got $ACTUAL"
            exit 1
          fi
          echo "PASS: redis-port=$ACTUAL"
      - name: Assert redis-server is running on custom port
        run: |
          echo "Checking redis-server on port 6380..."
          redis-cli -p 6380 ping | grep -i PONG
          if [ $? -ne 0 ]; then
            echo "FAIL: redis-server is not responding on port 6380"
            exit 1
          fi
          echo "PASS: redis-server is running on port 6380"
