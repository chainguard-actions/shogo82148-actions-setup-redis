name: Test Redis setup with extra configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "true"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6379" ]; then
            echo "FAIL: expected redis-port to be '6379', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: redis-port is correct"
      - name: Assert Redis is running
        run: |
          echo "Pinging Redis..."
          PONG=$(redis-cli -p 6379 ping 2>&1 || true)
          echo "Response: $PONG"
          if [ "$PONG" != "PONG" ]; then
            echo "FAIL: expected PONG from redis-cli ping, got '$PONG'"
            exit 1
          fi
          echo "PASS: Redis is running"
      - name: Assert maxmemory config was applied
        run: |
          echo "Checking maxmemory config..."
          MAXMEM=$(redis-cli -p 6379 config get maxmemory | tail -1 2>&1 || true)
          echo "maxmemory value: $MAXMEM"
          # 64mb = 67108864 bytes
          if [ "$MAXMEM" != "67108864" ]; then
            echo "FAIL: expected maxmemory to be 67108864 (64mb), got '$MAXMEM'"
            exit 1
          fi
          echo "PASS: maxmemory config was applied correctly"
      - name: Assert maxmemory-policy config was applied
        run: |
          echo "Checking maxmemory-policy config..."
          POLICY=$(redis-cli -p 6379 config get maxmemory-policy | tail -1 2>&1 || true)
          echo "maxmemory-policy value: $POLICY"
          if [ "$POLICY" != "allkeys-lru" ]; then
            echo "FAIL: expected maxmemory-policy to be 'allkeys-lru', got '$POLICY'"
            exit 1
          fi
          echo "PASS: maxmemory-policy config was applied correctly"
