name: Test Redis setup with extra configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert redis-port output
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "redis-port: $REDIS_PORT"
          if [ -z "$REDIS_PORT" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$REDIS_PORT"
      - name: Assert redis-server is running
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "Checking redis-server on port $REDIS_PORT"
          if ! redis-cli -p "$REDIS_PORT" ping | grep -q PONG; then
            echo "FAIL: redis-server did not respond to PING"
            exit 1
          fi
          echo "PASS: redis-server responded to PING"
      - name: Assert maxmemory config is applied
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "Checking maxmemory config"
          MAXMEM=$(redis-cli -p "$REDIS_PORT" config get maxmemory | tail -1)
          echo "maxmemory: $MAXMEM"
          # 64mb = 67108864 bytes
          if [ "$MAXMEM" != "67108864" ]; then
            echo "FAIL: expected maxmemory to be 67108864, got $MAXMEM"
            exit 1
          fi
          echo "PASS: maxmemory is set correctly"
      - name: Assert maxmemory-policy config is applied
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "Checking maxmemory-policy config"
          POLICY=$(redis-cli -p "$REDIS_PORT" config get maxmemory-policy | tail -1)
          echo "maxmemory-policy: $POLICY"
          if [ "$POLICY" != "allkeys-lru" ]; then
            echo "FAIL: expected maxmemory-policy to be allkeys-lru, got $POLICY"
            exit 1
          fi
          echo "PASS: maxmemory-policy is set correctly"
