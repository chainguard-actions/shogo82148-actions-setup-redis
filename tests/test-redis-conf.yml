name: Test Redis setup with extra configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert Redis is running
        run: |
          echo "Pinging Redis on default port 6379..."
          PONG=$(redis-cli -p 6379 ping 2>&1 || true)
          echo "Response: $PONG"
          if [ "$PONG" != "PONG" ]; then
            echo "FAIL: expected PONG from redis-cli ping, got '$PONG'"
            exit 1
          fi
          echo "PASS: Redis is running"
      - name: Assert maxmemory config is applied
        run: |
          echo "Checking maxmemory configuration..."
          MAXMEM=$(redis-cli -p 6379 config get maxmemory | tail -1 2>&1 || true)
          echo "maxmemory value: $MAXMEM"
          # 64mb = 67108864 bytes
          if [ "$MAXMEM" != "67108864" ]; then
            echo "FAIL: expected maxmemory to be 67108864 (64mb), got '$MAXMEM'"
            exit 1
          fi
          echo "PASS: maxmemory is set to 64mb"
      - name: Assert maxmemory-policy config is applied
        run: |
          echo "Checking maxmemory-policy configuration..."
          POLICY=$(redis-cli -p 6379 config get maxmemory-policy | tail -1 2>&1 || true)
          echo "maxmemory-policy value: $POLICY"
          if [ "$POLICY" != "allkeys-lru" ]; then
            echo "FAIL: expected maxmemory-policy to be allkeys-lru, got '$POLICY'"
            exit 1
          fi
          echo "PASS: maxmemory-policy is set to allkeys-lru"
