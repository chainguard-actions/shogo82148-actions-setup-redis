name: Test Redis setup with extra configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for Redis binary extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert redis-port output is set
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "redis-port: $REDIS_PORT"
          if [ -z "$REDIS_PORT" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$REDIS_PORT"
      - name: Assert Redis is running and responding
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          RESULT=$("$REDIS_PATH/redis-cli" -p "$REDIS_PORT" ping)
          echo "ping result: $RESULT"
          if [ "$RESULT" != "PONG" ]; then
            echo "FAIL: expected PONG but got '$RESULT'"
            exit 1
          fi
          echo "PASS: Redis is responding"
      - name: Assert maxmemory-policy config was applied
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          POLICY=$("$REDIS_PATH/redis-cli" -p "$REDIS_PORT" config get maxmemory-policy | tail -1 | tr -d '\r')
          echo "maxmemory-policy: $POLICY"
          if [ "$POLICY" != "allkeys-lru" ]; then
            echo "FAIL: expected maxmemory-policy=allkeys-lru but got '$POLICY'"
            exit 1
          fi
          echo "PASS: maxmemory-policy is correctly set to allkeys-lru"
      - name: Assert maxmemory config was applied
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          MAXMEM=$("$REDIS_PATH/redis-cli" -p "$REDIS_PORT" config get maxmemory | tail -1 | tr -d '\r')
          echo "maxmemory: $MAXMEM"
          # 64mb = 67108864 bytes
          if [ "$MAXMEM" != "67108864" ]; then
            echo "FAIL: expected maxmemory=67108864 (64mb) but got '$MAXMEM'"
            exit 1
          fi
          echo "PASS: maxmemory is correctly set to 64mb"
