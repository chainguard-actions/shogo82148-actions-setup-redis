name: Test Redis setup with extra redis.conf options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
          redis-port: "6379"
          auto-start: "true"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6379" ]; then
            echo "FAIL: expected redis-port to be '6379', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: redis-port output is correct"
      - name: Assert redis-server is running
        run: |
          echo "Checking if redis-server is listening on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: redis-server did not respond to PING on port 6379"
            exit 1
          fi
          echo "PASS: redis-server is running"
      - name: Assert maxmemory config is applied
        run: |
          MAXMEM=$(redis-cli -p 6379 CONFIG GET maxmemory | tail -1)
          echo "maxmemory value: $MAXMEM"
          # 64mb = 67108864 bytes
          if [ "$MAXMEM" != "67108864" ]; then
            echo "FAIL: expected maxmemory to be 67108864 (64mb), got '$MAXMEM'"
            exit 1
          fi
          echo "PASS: maxmemory config is applied correctly"
      - name: Assert maxmemory-policy config is applied
        run: |
          POLICY=$(redis-cli -p 6379 CONFIG GET maxmemory-policy | tail -1)
          echo "maxmemory-policy value: $POLICY"
          if [ "$POLICY" != "allkeys-lru" ]; then
            echo "FAIL: expected maxmemory-policy to be 'allkeys-lru', got '$POLICY'"
            exit 1
          fi
          echo "PASS: maxmemory-policy config is applied correctly"
