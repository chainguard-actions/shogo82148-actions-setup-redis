name: Test redis setup with redis-conf input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "true"
          redis-conf: |
            maxmemory 64mb
            maxmemory-policy allkeys-lru
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$ACTUAL"
      - name: Assert redis-server is running with custom config
        run: |
          echo "Checking redis-server on port 6379..."
          redis-cli -p 6379 ping | grep -i PONG
          if [ $? -ne 0 ]; then
            echo "FAIL: redis-server is not responding"
            exit 1
          fi
          echo "PASS: redis-server is running"
      - name: Assert maxmemory config was applied
        run: |
          MAXMEM=$(redis-cli -p 6379 config get maxmemory | tail -1)
          echo "maxmemory: $MAXMEM"
          if [ "$MAXMEM" = "0" ] || [ -z "$MAXMEM" ]; then
            echo "FAIL: maxmemory was not set (got: $MAXMEM)"
            exit 1
          fi
          echo "PASS: maxmemory=$MAXMEM"
