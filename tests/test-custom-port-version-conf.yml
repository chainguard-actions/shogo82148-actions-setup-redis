name: Test specific version, custom port and redis-conf
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure zstd is available (needed to extract redis binaries)
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO=sudo
            $SUDO apt-get update -y && $SUDO apt-get install -y zstd
          fi
      - id: action
        uses: .
        with:
          redis-version: "7.2"
          redis-port: "6390"
          redis-conf: |
            maxmemory 12mb
            databases 4
      - name: Assert outputs
        env:
          PORT: ${{ steps.action.outputs.redis-port }}
        run: |
          echo "port: $PORT"
          [ "$PORT" = "6390" ] || { echo "FAIL: expected port 6390"; exit 1; }
          echo "PASS"
      - name: Assert version and config
        run: |
          VER="$(redis-cli -p 6390 info server | tr -d '\r' | grep '^redis_version:' | cut -d: -f2)"
          echo "redis_version: $VER"
          case "$VER" in
            7.2.*) ;;
            *) echo "FAIL: expected 7.2.x"; exit 1 ;;
          esac
          MAXMEM="$(redis-cli -p 6390 config get maxmemory | tail -n1)"
          echo "maxmemory: $MAXMEM"
          [ "$MAXMEM" = "12582912" ] || { echo "FAIL: maxmemory not applied"; exit 1; }
          DBS="$(redis-cli -p 6390 config get databases | tail -n1)"
          echo "databases: $DBS"
          [ "$DBS" = "4" ] || { echo "FAIL: databases not applied"; exit 1; }
          if redis-cli -p 6379 ping >/dev/null 2>&1; then
            echo "FAIL: redis unexpectedly listening on default port 6379"
            exit 1
          fi
          echo "PASS"
