name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for Redis archive extraction)
        run: sudo apt-get install -y zstd
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
      - name: Assert redis-port output
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "redis-port: $REDIS_PORT"
          if [ -z "$REDIS_PORT" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$REDIS_PORT"
      - name: Assert redis-path output
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "redis-path: $REDIS_PATH"
          if [ -z "$REDIS_PATH" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          echo "PASS: redis-path=$REDIS_PATH"
      - name: Assert redis-server is running on default port
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "Checking Redis on port $REDIS_PORT"
          if ! redis-cli -p "$REDIS_PORT" ping | grep -q PONG; then
            echo "FAIL: redis-server did not respond to PING"
            exit 1
          fi
          echo "PASS: Redis responded to PING"
      - name: Assert redis-server can set and get a key
        env:
          REDIS_PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          redis-cli -p "$REDIS_PORT" SET testkey testvalue
          RESULT=$(redis-cli -p "$REDIS_PORT" GET testkey)
          echo "GET testkey: $RESULT"
          if [ "$RESULT" != "testvalue" ]; then
            echo "FAIL: expected 'testvalue' but got '$RESULT'"
            exit 1
          fi
          echo "PASS"
