name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
          redis-port: "6379"
          auto-start: "true"
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6379" ]; then
            echo "FAIL: expected redis-port to be '6379', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: redis-port output is correct"
      - name: Assert redis-path output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected redis-path to be non-empty"
            exit 1
          fi
          echo "PASS: redis-path output is set"
      - name: Assert redis-server is running on port 6379
        run: |
          echo "Checking if redis-server is listening on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: redis-server did not respond to PING on port 6379"
            exit 1
          fi
          echo "PASS: redis-server is running and responding"
      - name: Assert redis-cli can set and get a value
        run: |
          redis-cli -p 6379 SET testkey "hello"
          VALUE=$(redis-cli -p 6379 GET testkey)
          echo "actual value: $VALUE"
          if [ "$VALUE" != "hello" ]; then
            echo "FAIL: expected 'hello', got '$VALUE'"
            exit 1
          fi
          echo "PASS: redis set/get works correctly"
