name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "true"
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$ACTUAL"
      - name: Assert redis-path output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          echo "PASS: redis-path=$ACTUAL"
      - name: Assert redis-server is running
        run: |
          echo "Checking redis-server on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q PONG; then
            echo "FAIL: redis-server did not respond to PING"
            exit 1
          fi
          echo "PASS: redis-server is running"
