name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for Redis binary extraction)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zstd
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
          auto-start: "true"
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port=$ACTUAL"
      - name: Assert redis-path output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          if [ ! -f "$ACTUAL/redis-cli" ]; then
            echo "FAIL: redis-cli not found at $ACTUAL/redis-cli"
            exit 1
          fi
          echo "PASS: redis-path=$ACTUAL"
      - name: Assert redis-server is running
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
          PORT: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "Checking Redis on port $PORT using $REDIS_PATH/redis-cli"
          if ! "$REDIS_PATH/redis-cli" -p "$PORT" ping | grep -q PONG; then
            echo "FAIL: redis-cli ping did not return PONG"
            exit 1
          fi
          echo "PASS: Redis is running and responding to PING"
      - name: Assert redis-unix-socket output is set
        env:
          SOCK: ${{ steps.setup-redis.outputs.redis-unix-socket }}
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-unix-socket: $SOCK"
          if [ -z "$SOCK" ]; then
            echo "FAIL: redis-unix-socket output is empty"
            exit 1
          fi
          if ! "$REDIS_PATH/redis-cli" -s "$SOCK" ping | grep -q PONG; then
            echo "FAIL: redis-cli ping via unix socket did not return PONG"
            exit 1
          fi
          echo "PASS: Redis is also reachable via unix socket"
