name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup-redis
        name: Setup Redis (default settings)
        uses: .
        with:
          redis-version: "7"

      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ "$ACTUAL" != "6379" ]; then
            echo "FAIL: expected redis-port to be 6379, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: redis-port is 6379"

      - name: Assert redis-path output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected redis-path to be non-empty"
            exit 1
          fi
          echo "PASS: redis-path is set to $ACTUAL"

      - name: Assert redis-server is running on default port
        run: |
          echo "Checking Redis is running on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: redis-cli ping did not return PONG"
            exit 1
          fi
          echo "PASS: Redis is running and responding to PING"

      - name: Assert redis-unix-socket output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "actual redis-unix-socket: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected redis-unix-socket to be non-empty"
            exit 1
          fi
          echo "PASS: redis-unix-socket is set to $ACTUAL"
