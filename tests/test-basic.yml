name: Test basic Redis setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "true"
      - name: Assert redis-port output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-port }}
        run: |
          echo "actual redis-port: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-port output is empty"
            exit 1
          fi
          echo "PASS: redis-port output is set to $ACTUAL"
      - name: Assert redis-path output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          if [ ! -d "$ACTUAL" ]; then
            echo "FAIL: redis-path directory does not exist: $ACTUAL"
            exit 1
          fi
          echo "PASS: redis-path is set to $ACTUAL"
      - name: Assert redis-server is running on default port
        run: |
          echo "Checking redis-server is running on port 6379..."
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: redis-server did not respond to PING on port 6379"
            exit 1
          fi
          echo "PASS: redis-server responded to PING"
      - name: Assert redis-unix-socket output
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "actual redis-unix-socket: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-unix-socket output is empty"
            exit 1
          fi
          echo "PASS: redis-unix-socket is set to $ACTUAL"
