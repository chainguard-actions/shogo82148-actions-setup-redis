name: Test Redis setup with auto-start disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "false"
      - name: Assert redis-path output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          echo "PASS: redis-path=$ACTUAL"
      - name: Assert redis-server binary exists but is not running
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "Checking redis-server binary at: $REDIS_PATH"
          if [ ! -f "$REDIS_PATH/redis-server" ]; then
            echo "FAIL: redis-server binary not found at $REDIS_PATH/redis-server"
            exit 1
          fi
          echo "PASS: redis-server binary exists at $REDIS_PATH/redis-server"
          echo "Verifying redis-server is NOT running (auto-start=false)..."
          if redis-cli -p 6379 ping 2>/dev/null | grep -q PONG; then
            echo "FAIL: redis-server is running but auto-start was false"
            exit 1
          fi
          echo "PASS: redis-server is not running as expected"
