name: Test Redis setup with auto-start disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "latest"
          redis-port: "6379"
          auto-start: "false"
      - name: Assert redis-path output is set
        env:
          ACTUAL: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "actual redis-path: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: redis-path output is empty"
            exit 1
          fi
          echo "PASS: redis-path output is set to $ACTUAL"
      - name: Assert redis-server binary exists
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "Checking if redis-server binary exists at $REDIS_PATH..."
          if [ ! -f "$REDIS_PATH/redis-server" ]; then
            echo "FAIL: redis-server binary not found at $REDIS_PATH/redis-server"
            exit 1
          fi
          echo "PASS: redis-server binary exists"
      - name: Assert redis-server is NOT running (auto-start disabled)
        run: |
          echo "Checking that redis-server is NOT running since auto-start is disabled..."
          if redis-cli -p 6379 ping 2>/dev/null | grep -q "PONG"; then
            echo "FAIL: redis-server should not be running when auto-start is false"
            exit 1
          fi
          echo "PASS: redis-server is not running as expected"
      - name: Start redis-server manually and verify it works
        env:
          REDIS_PATH: ${{ steps.setup-redis.outputs.redis-path }}
        run: |
          echo "Starting redis-server manually..."
          "$REDIS_PATH/redis-server" --port 6379 --daemonize yes --logfile /tmp/redis-manual.log
          sleep 2
          if ! redis-cli -p 6379 ping | grep -q "PONG"; then
            echo "FAIL: manually started redis-server is not responding"
            cat /tmp/redis-manual.log || true
            exit 1
          fi
          echo "PASS: manually started redis-server is responding"
