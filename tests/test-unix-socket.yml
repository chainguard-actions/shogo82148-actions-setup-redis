name: Test Redis unix socket output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
      - name: Assert redis-unix-socket output
        env:
          REDIS_SOCKET: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "redis-unix-socket: $REDIS_SOCKET"
          if [ -z "$REDIS_SOCKET" ]; then
            echo "FAIL: redis-unix-socket output is empty"
            exit 1
          fi
          echo "PASS: redis-unix-socket=$REDIS_SOCKET"
      - name: Assert redis-server responds on unix socket
        env:
          REDIS_SOCKET: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "Checking redis-server responds on unix socket: $REDIS_SOCKET"
          if [ ! -S "$REDIS_SOCKET" ]; then
            echo "FAIL: unix socket file does not exist at $REDIS_SOCKET"
            exit 1
          fi
          if ! redis-cli -s "$REDIS_SOCKET" ping | grep -q PONG; then
            echo "FAIL: redis-server did not respond to PING on unix socket"
            exit 1
          fi
          echo "PASS: redis-server is responding on unix socket"
