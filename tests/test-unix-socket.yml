name: Test Redis unix socket output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install zstd (required for Redis archive extraction)
        run: sudo apt-get install -y zstd
      - id: setup-redis
        uses: .
        with:
          redis-version: "7"
      - name: Assert redis-unix-socket output is set
        env:
          REDIS_SOCKET: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "redis-unix-socket: $REDIS_SOCKET"
          if [ -z "$REDIS_SOCKET" ]; then
            echo "FAIL: redis-unix-socket output is empty"
            exit 1
          fi
          echo "PASS: redis-unix-socket=$REDIS_SOCKET"
      - name: Assert redis-server is accessible via unix socket
        env:
          REDIS_SOCKET: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          echo "Checking Redis via unix socket: $REDIS_SOCKET"
          if [ ! -S "$REDIS_SOCKET" ]; then
            echo "FAIL: unix socket file does not exist at $REDIS_SOCKET"
            exit 1
          fi
          if ! redis-cli -s "$REDIS_SOCKET" ping | grep -q PONG; then
            echo "FAIL: redis-server did not respond to PING via unix socket"
            exit 1
          fi
          echo "PASS: Redis responded to PING via unix socket"
      - name: Assert redis-server can set and get via unix socket
        env:
          REDIS_SOCKET: ${{ steps.setup-redis.outputs.redis-unix-socket }}
        run: |
          redis-cli -s "$REDIS_SOCKET" SET socketkey socketvalue
          RESULT=$(redis-cli -s "$REDIS_SOCKET" GET socketkey)
          echo "GET socketkey: $RESULT"
          if [ "$RESULT" != "socketvalue" ]; then
            echo "FAIL: expected 'socketvalue' but got '$RESULT'"
            exit 1
          fi
          echo "PASS"
